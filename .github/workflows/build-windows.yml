name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:   # lets you trigger a build manually from the GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r packaging/windows/requirements-windows.txt
          python -m pip install "pyinstaller>=6.6"

      - name: Build app with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/windows/app.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          Push-Location packaging/windows
          & $iscc installer.iss
          Pop-Location

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PioneerDJLink-portable
          path: dist/PioneerDJLink/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PioneerDJLink-Setup
          path: packaging/windows/Output/PioneerDJLink-Setup.exe

      - name: Attach installer to GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/Output/PioneerDJLink-Setup.exe
